<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Qranks Demo Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: Qlik.com feel — floating rounded nav card, white space, deep-blue headlines, green pill actions.
   Home = scene-setter + portfolio coverage + chapter cards; each chapter = 4 selectable stages. */
:root{
  --bg:#ffffff; --surface:#f3f6f7; --surface-2:#e9eef0; --card:#ffffff; --line:#dfe5e8;
  --head:#19426c; --body:#54565a; --muted:#6f7479;
  --green:#009845; --btn:#16833f; --btn-hover:#0f6d33; --on-btn:#ffffff;
  --ocean:#006580; --sky:#10cfc9; --soft-green:#e6f5ec; --soft-blue:#e8eef5;
  --shadow:0 10px 30px rgba(25,66,108,.10);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1724; --surface:#102234; --surface-2:#163049; --card:#122a40; --line:#21405c;
  --head:#e4eef8; --body:#b8c4ce; --muted:#8fa0ad;
  --green:#3cc277; --btn:#1d9a4c; --btn-hover:#23ad57; --on-btn:#ffffff;
  --ocean:#5bbdd6; --sky:#3fded8; --soft-green:#123a2a; --soft-blue:#16304a;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1724; --surface:#102234; --surface-2:#163049; --card:#122a40; --line:#21405c;
  --head:#e4eef8; --body:#b8c4ce; --muted:#8fa0ad;
  --green:#3cc277; --btn:#1d9a4c; --btn-hover:#23ad57; --on-btn:#ffffff;
  --ocean:#5bbdd6; --sky:#3fded8; --soft-green:#123a2a; --soft-blue:#16304a;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-inline:24px}
@media (max-width:600px){.wrap{padding-inline:16px}}
h1,h2,h3,h4{color:var(--head);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(1.6rem,3vw,2.25rem);font-weight:700;letter-spacing:-.01em}
h3{font-size:1.2rem;font-weight:600}
p{margin:0}
a{color:var(--ocean)}
.eyebrow{font-size:.78rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ocean)}
.lead{font-size:1.2rem;font-weight:300;max-width:62ch}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font:600 1rem/1 var(--font);padding:14px 26px;border-radius:999px;border:2px solid var(--btn);cursor:pointer;text-decoration:none;transition:background .15s,color .15s}
.btn-primary{background:var(--btn);color:var(--on-btn)}
.btn-primary:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn-ghost{background:transparent;color:var(--green)}
.btn-ghost:hover{background:var(--soft-green)}
.btn[aria-disabled="true"]{background:var(--surface-2);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.btn-sm{padding:9px 18px;font-size:.9rem}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:14px}
.navcard{background:var(--card);border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:12px 16px 12px 24px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--head);white-space:nowrap;padding-right:18px;border-right:1px solid var(--line)}
.brand b{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:.82rem;color:var(--muted);font-weight:500}
.chapnav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.chapnav::-webkit-scrollbar{display:none}
.chapnav a{flex:none;text-decoration:none;color:var(--muted);font-weight:500;font-size:.92rem;padding:8px 12px;border-radius:999px;white-space:nowrap}
.chapnav a:hover{color:var(--head);background:var(--surface)}
.chapnav a[aria-current="page"]{color:var(--green);background:var(--soft-green)}
.chapnav a .n{font-variant-numeric:tabular-nums;font-weight:700;margin-right:6px}
@media (max-width:760px){.brand span{display:none}.navcard{gap:12px;padding-left:16px}.brand{padding-right:12px}}

main{padding-block:16px 80px}
section{padding-block:56px}

/* Home hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-block:48px 40px}
.hero h1 .g{color:var(--green);display:block}
.hero .lead{margin-top:22px}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.factcard{background:linear-gradient(160deg,var(--head) 0%,var(--ocean) 100%);border-radius:24px;padding:28px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
:root[data-theme="dark"] .factcard{background:linear-gradient(160deg,#173a5e 0%,#0b5a6f 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .factcard{background:linear-gradient(160deg,#173a5e 0%,#0b5a6f 100%)}}
.factcard h3{color:#fff;font-size:1rem;font-weight:500;opacity:.85}
.factcard .co{font-size:1.6rem;font-weight:700;margin-top:4px;color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;line-height:1.1}
.stat span{font-size:.82rem;color:rgba(255,255,255,.82)}
.facts{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:6px;font-size:.9rem;color:rgba(255,255,255,.88)}
.facts li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid rgba(255,255,255,.15);padding-top:6px}
.facts li b{font-weight:600;color:#fff;text-align:right}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:32px}}

.sechead{display:grid;gap:12px;margin-bottom:32px;max-width:760px}
.sechead.center{margin-inline:auto;text-align:center;justify-items:center}

/* How to use */
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.howto div{background:var(--surface);border-radius:20px;padding:24px}
.howto h3{margin-bottom:8px}
@media (max-width:800px){.howto{grid-template-columns:1fr}}

/* Portfolio coverage */
.picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;justify-content:center}
.picker button{font:500 .9rem var(--font);color:var(--body);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.picker button:hover{border-color:var(--green)}
.picker button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pillar{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.pillar h3{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ocean);font-weight:600}
.pillar p.tag{font-size:.9rem;color:var(--muted);margin:4px 0 16px}
.caps{display:flex;flex-wrap:wrap;gap:8px}
.cap{font-size:.86rem;padding:7px 12px;border-radius:10px;background:var(--surface);color:var(--muted);border:1px solid transparent;transition:all .2s}
.cap.on{background:var(--soft-green);color:var(--head);border-color:var(--green);font-weight:500}
.cap .ct{font-variant-numeric:tabular-nums;font-size:.75rem;margin-left:6px;color:var(--green);font-weight:700}
.covnote{text-align:center;margin-top:18px;font-size:.92rem;color:var(--muted)}
@media (max-width:900px){.pillars{grid-template-columns:1fr}}

/* Story cards */
.stories{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.story{display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;text-decoration:none;color:inherit;transition:box-shadow .2s,transform .2s,border-color .2s}
.story:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--green)}
.story .num{font-size:.8rem;font-weight:700;letter-spacing:.12em;color:var(--green)}
.story h3{font-size:1.3rem;font-weight:700}
.story .pos{font-size:.9rem}
.story .prods{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.chip{font-size:.76rem;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--soft-blue);color:var(--head);white-space:nowrap}
.story .go{font-weight:600;color:var(--green);font-size:.92rem}
@media (max-width:980px){.stories{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.stories{grid-template-columns:1fr}}

/* Environment */
.env{background:var(--surface);border-radius:24px;padding:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.env div{min-width:0}
.env dt{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.env dd{margin:6px 0 0;color:var(--head);font-weight:500;overflow-wrap:anywhere}
@media (max-width:900px){.env{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.env{grid-template-columns:1fr}}

/* Chapter */
.crumb{font-size:.9rem;color:var(--muted);display:flex;gap:8px;align-items:center;padding-top:20px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--green)}
.chead{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;padding-block:24px 28px;border-bottom:1px solid var(--line)}
.chead h1{font-size:clamp(2rem,4.4vw,3.1rem);margin-top:10px}
.chead .sub{margin-top:14px;font-size:1.1rem;font-weight:300;max-width:64ch}
.chead .prods{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.launch{display:grid;gap:8px;justify-items:end;text-align:right}
.launch small{font-size:.8rem;color:var(--muted)}
@media (max-width:800px){.chead{grid-template-columns:1fr}.launch{justify-items:start;text-align:left}}

.stages{display:flex;gap:6px;margin-block:28px 32px;overflow-x:auto;padding-bottom:4px}
.stages button{flex:1 0 auto;display:flex;align-items:center;gap:10px;font:500 .95rem var(--font);color:var(--muted);background:var(--surface);border:1.5px solid transparent;border-radius:16px;padding:12px 18px;cursor:pointer;text-align:left;white-space:nowrap}
.stages button .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--card);color:var(--muted);font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums}
.stages button:hover{color:var(--head)}
.stages button[aria-selected="true"]{background:var(--card);border-color:var(--green);color:var(--head);box-shadow:var(--shadow)}
.stages button[aria-selected="true"] .n{background:var(--btn);color:var(--on-btn)}

.panel{animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.story,.cap{transition:none}}

/* Problem */
.scenario{font-size:clamp(1.25rem,2.4vw,1.6rem);font-weight:300;line-height:1.5;color:var(--head);max-width:58ch;position:relative;padding-left:44px}
.scenario::before{content:"\201C";position:absolute;left:0;top:-14px;font-size:4.2rem;font-weight:700;color:var(--green);line-height:1}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:36px}
.tile{background:var(--surface);border-radius:18px;padding:20px}
.tile b{display:block;font-size:2rem;font-weight:700;color:var(--head);font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:.9rem;display:block;margin-top:6px}
@media (max-width:860px){.tiles{grid-template-columns:1fr 1fr}}
.ask{margin-top:28px;display:flex;gap:16px;align-items:flex-start;background:var(--soft-blue);border-radius:18px;padding:18px 22px;max-width:760px}
.ask .lbl{flex:none;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ocean);padding-top:4px}
.ask p{color:var(--head);font-weight:500}

/* Capability map */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
.node{flex:1 1 180px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.node .area{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ocean)}
.node h4{font-size:1.05rem;margin-top:6px}
.node p{font-size:.92rem;margin-top:8px}
.arrow{flex:none;display:grid;place-items:center;color:var(--green);font-size:1.4rem;font-weight:700}
@media (max-width:760px){.arrow{display:none}}
.journey{margin-top:36px}
.journey h3{margin-bottom:14px}
.journey ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:j}
.journey li{counter-increment:j;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.journey li::before{content:counter(j);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft-green);color:var(--green);font-weight:700;font-size:.85rem}
.journey li b{color:var(--head);font-weight:600}

/* Walkthrough */
.walk{display:grid;grid-template-columns:320px 1fr;gap:28px;align-items:start}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steps button{width:100%;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;text-align:left;font:500 .95rem/1.35 var(--font);color:var(--body);background:var(--surface);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;cursor:pointer}
.steps button .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--card);font-weight:700;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.steps button:hover{color:var(--head)}
.steps button[aria-current="step"]{background:var(--card);border-color:var(--green);color:var(--head);box-shadow:var(--shadow)}
.steps button[aria-current="step"] .n{background:var(--btn);color:var(--on-btn)}
.stepview{min-width:0;display:grid;gap:20px}
.stepview .kicker{font-size:.8rem;font-weight:700;letter-spacing:.12em;color:var(--green);text-transform:uppercase}
.stepview h3{font-size:1.5rem;font-weight:700;margin-top:6px}
.shot{aspect-ratio:16/9;max-width:100%;border-radius:18px;border:2px dashed var(--line);background:var(--surface);display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.92rem;padding:16px}
.shot img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{border-radius:18px;padding:18px 20px;min-width:0}
.box .lbl{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.box p{margin-top:8px}
.box.click{background:var(--surface)}
.box.click .lbl{color:var(--ocean)}
.box.say{background:var(--soft-green)}
.box.say .lbl{color:var(--green)}
.box.say p{color:var(--head);font-weight:500;font-size:1.08rem}
.stepnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.stepnav small{color:var(--muted);font-size:.82rem}
@media (max-width:900px){.walk{grid-template-columns:1fr}.duo{grid-template-columns:1fr}}

/* Value */
.tagline{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:700;color:var(--head);letter-spacing:-.01em;max-width:30ch}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.ba > div{border-radius:20px;padding:24px;min-width:0}
.ba .before{background:var(--surface)}
.ba .after{background:var(--soft-green)}
.ba h3{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:14px}
.ba .before h3{color:var(--muted)}
.ba .after h3{color:var(--green)}
.ba ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.ba li{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:.96rem}
.ba .before li::before{content:"\2013";color:var(--muted);font-weight:700}
.ba .after li::before{content:"\2713";color:var(--green);font-weight:700}
.ba .after li{color:var(--head)}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.result{border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--card)}
.result b{display:block;font-size:2.1rem;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.1}
.result span{display:block;margin-top:6px;font-size:.92rem}
@media (max-width:800px){.ba{grid-template-columns:1fr}.results{grid-template-columns:1fr}}

/* Showcase */
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.menu article{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px}
.menu .num{font-size:.78rem;font-weight:700;color:var(--green);letter-spacing:.1em}
.menu h4{font-size:1.05rem}
.menu p{font-size:.9rem}
.menu .val{color:var(--head);font-weight:500;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.tbd{color:var(--muted);font-style:italic}
@media (max-width:1000px){.menu{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.menu{grid-template-columns:1fr}}

.pager{display:flex;justify-content:space-between;gap:16px;margin-top:56px;padding-top:28px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager a{text-decoration:none;display:grid;gap:4px;max-width:46%;min-width:0}
.pager a small{color:var(--muted);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
.pager a span{color:var(--head);font-weight:600}
.pager a:hover span{color:var(--green)}
.pager .next{text-align:right;margin-left:auto}
footer{border-top:1px solid var(--line);padding-block:28px;font-size:.85rem;color:var(--muted)}
</style>

<header class="top">
  <div class="wrap">
    <nav class="navcard" aria-label="Demo chapters">
      <a class="brand" href="#home"><b>Qranks</b><span>Qlik End-to-End Demo</span></a>
      <div class="chapnav" id="chapnav"></div>
    </nav>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer>
  <div class="wrap">Qranks is a fictional company for Qlik demonstrations. For Qlik employee use.</div>
</footer>

<script>
/* ============================================================

const COMPANY = {

  env: [

    ["Tenancy", "One shared tenant today; per-presenter spaces via Git later"]

};

/* Portfolio — the trusted intelligence layer */
const PORTFOLIO = [
  {pillar:"Data", tag:"We make your data work wherever it lives", caps:["Real-Time Pipelines","Data Transformation","Quality & Governance","Catalog & Lineage","Data Products","Agentic Data Engineering","Open Lakehouse","Application & API Integration"]},
  {pillar:"Analytics", tag:"We make your data work with AI", caps:["Visualization & Dashboards","Conversational AI","Predictive AI","Anomaly Detection","AI Agents","Embedded Analytics","Enterprise Reporting"]},
  {pillar:"Platform", tag:"We make your data work for AI", caps:["MCP Server","Workflow Automation","Governance, Security & Compliance","Semantic Layer","Hybrid Deployment"]}
];

const STORIES = [
 {
  id:1, title:"From dirty data to trusted insights",
  summary:"Six conflicting sources become one certified revenue number the CFO can trace to its source row, and anyone can query in plain English.",

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const state = {stage:{}, step:{}, cover:"all"};
const app = $("#app");

function stagesFor(s){
  return s.showcase
    ? [["menu","Capability menu"],["walk","Click & talk"]]
    : [["problem","The problem"],["map","Capability map"],["walk","Click & talk"],["value","Value"]];
}

function renderNav(current){
  $("#chapnav").innerHTML =
    `<a href="#home" ${current==="home"?'aria-current="page"':""}>Overview</a>` +
    STORIES.map(s => `<a href="#story-${s.id}" ${current===s.id?'aria-current="page"':""}><span class="n">${pad(s.id)}</span>${esc(shortTitle(s))}</a>`).join("");
  const cur = $("#chapnav [aria-current]");
  if (cur) cur.scrollIntoView({block:"nearest", inline:"nearest"});
}
function shortTitle(s){
  return ({1:"Trusted insights",2:"Churn",3:"Self-service",4:"Supply chain",5:"Sales truth",6:"Showcase"})[s.id];
}

function launchBtn(s, sm){
  return s.launch
    ? `<a class="btn btn-primary${sm?" btn-sm":""}" href="${esc(s.launch)}" target="_blank" rel="noopener">Launch demo ↗</a>`
    : `<span class="btn btn-primary${sm?" btn-sm":""}" aria-disabled="true" title="Demo link to come">Launch demo</span>`;
}

function paintCoverage(){
  const counts = {};
  STORIES.forEach(s => s.covers.forEach(c => counts[c] = (counts[c]||0)+1));
  const sel = state.cover === "all" ? null : STORIES.find(s => s.id === state.cover);
  const on = new Set(sel ? sel.covers : Object.keys(counts));
  let total = 0;
  app.querySelectorAll(".cap").forEach(el => {
    const c = el.dataset.cap; total++;
    el.classList.toggle("on", on.has(c));
    el.querySelector(".ct").textContent = (!sel && counts[c]) ? counts[c] : "";
  });
  const n = [...on].filter(c => app.querySelector(`.cap[data-cap="${CSS.escape(c)}"]`)).length;
  $("#covnote").innerHTML = sel
    ? `Story ${pad(sel.id)} shows ${n} of ${total} capabilities. <a href="#story-${sel.id}">Open the chapter →</a>`
    : `All six stories together show ${n} of ${total} capabilities. Numbers show how many stories use each one.`;
}

  const stages = stagesFor(s);
  const cur = state.stage[id] || stages[0][0];
  const prev = STORIES.find(x => x.id === id-1), next = STORIES.find(x => x.id === id+1);
  app.innerHTML = `
    <nav class="crumb" aria-label="Breadcrumb"><a href="#home">Overview</a><span aria-hidden="true">/</span><span>Story ${pad(id)}</span></nav>
    <div class="chead">

      <div class="launch">${launchBtn(s)}<small>${s.launch ? "Opens the demo starting point" : "Demo link to come"}</small></div>
    </div>
    <div class="stages" role="tablist" aria-label="Story stages">
      ${stages.map(([k,l],i) => `<button type="button" role="tab" id="tab-${k}" aria-controls="panel" aria-selected="${k===cur}" data-stage="${k}"><span class="n">${i+1}</span>${l}</button>`).join("")}
    </div>
    <div id="panel" class="panel" role="tabpanel" aria-labelledby="tab-${cur}"></div>
    <nav class="pager" aria-label="Chapters">
      ${prev ? `<a href="#story-${prev.id}"><small>← Story ${pad(prev.id)}</small><span>${esc(prev.title)}</span></a>` : `<a href="#home"><small>← Overview</small><span>Qranks and the portfolio</span></a>`}
      ${next ? `<a class="next" href="#story-${next.id}"><small>Story ${pad(next.id)} →</small><span>${esc(next.title)}</span></a>` : `<a class="next" href="#home"><small>Overview →</small><span>Back to all stories</span></a>`}
    </nav>`;
  app.querySelectorAll("[data-stage]").forEach(b => b.addEventListener("click", () => { state.stage[id] = b.dataset.stage; renderStory(id); $("#tab-"+b.dataset.stage).focus(); }));
  app.querySelector('[role="tablist"]').addEventListener("keydown", e => {
    if (!["ArrowLeft","ArrowRight"].includes(e.key)) return;
    const i = stages.findIndex(x => x[0] === cur) + (e.key === "ArrowRight" ? 1 : -1);
    if (stages[i]) { state.stage[id] = stages[i][0]; renderStory(id); $("#tab-"+stages[i][0]).focus(); }
  });
  renderStage(s, cur);
}

function renderStage(s, k){
  const p = $("#panel");
  if (k === "problem") {
    const pr = s.problem;
    p.innerHTML = `<p class="scenario">${esc(pr.scenario)}</p>
      <div class="tiles">${pr.stats.map(([v,l]) => `<div class="tile"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>
      <div class="ask"><span class="lbl">Ask the room</span><p>${esc(pr.ask)}</p></div>`;
  } else if (k === "map") {
    p.innerHTML = `<div class="flow">${s.map.map((m,i) => `${i ? '<span class="arrow" aria-hidden="true">→</span>' : ""}
      <div class="node"><span class="area">${esc(m.area)}</span><h4>${esc(m.name)}</h4><p>${esc(m.text)}</p></div>`).join("")}</div>
      ${s.journey ? `<div class="journey"><h3>${esc(s.journeyTitle)}</h3><ol>${s.journey.map(([a,t]) => `<li><span><b>${esc(a)}:</b> ${esc(t)}</span></li>`).join("")}</ol></div>` : ""}`;
  } else if (k === "walk") {
    renderWalk(s, p);
  } else if (k === "value") {
    const v = s.value;
    p.innerHTML = `<p class="tagline">${esc(v.tagline)}</p>
      <div class="ba"><div class="before"><h3>Before Qlik</h3><ul>${v.before.map(x => `<li><span>${esc(x)}</span></li>`).join("")}</ul></div>
      <div class="after"><h3>With Qlik</h3><ul>${v.after.map(x => `<li><span>${esc(x)}</span></li>`).join("")}</ul></div></div>
      <div class="results">${v.results.map(([n,l]) => `<div class="result"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("")}</div>`;
  } else if (k === "menu") {
    p.innerHTML = `<div class="menu">${s.showcase.map((c,i) => `<article>
      <span class="num">${pad(i+1)}</span><h4>${esc(c.title)}</h4>
      <p>${c.click ? esc(c.click) : '<span class="tbd">Description to come</span>'}</p>
      <p class="val">${c.say ? esc(c.say) : '<span class="tbd">Business value to come</span>'}</p></article>`).join("")}</div>`;
  }
}

function renderWalk(s, p){
  const steps = s.walk || s.showcase;
  const i = Math.min(state.step[s.id] || 0, steps.length-1);
  const st = steps[i];
  p.innerHTML = `<div class="walk">
    <ol class="steps">${steps.map((x,j) => `<li><button type="button" data-step="${j}" ${j===i?'aria-current="step"':""}><span class="n">${j+1}</span><span>${esc(x.title)}</span></button></li>`).join("")}</ol>
    <div class="stepview">
      <div><span class="kicker">Step ${i+1} of ${steps.length}</span><h3>${esc(st.title)}</h3></div>
      <div class="shot">${st.img ? `<img src="${esc(st.img)}" alt="Screenshot: ${esc(st.title)}">` : `Screenshot for step ${i+1} to come`}</div>
      <div class="duo">
        <div class="box click"><span class="lbl">${s.showcase ? "What it does" : "Click"}</span><p>${st.click ? esc(st.click) : '<span class="tbd">To be written</span>'}</p></div>
        <div class="box say"><span class="lbl">${s.showcase ? "Business value" : "Say"}</span><p>${st.say ? esc(st.say) : '<span class="tbd">To be written</span>'}</p></div>
      </div>
      <div class="stepnav">
        <button type="button" class="btn btn-ghost btn-sm" data-go="-1" ${i===0?"disabled":""}>← Previous step</button>
        <small>Use ← → keys to move between steps</small>
        <button type="button" class="btn btn-primary btn-sm" data-go="1" ${i===steps.length-1?"disabled":""}>Next step →</button>
      </div>
    </div></div>`;
  const go = j => { if (j<0||j>=steps.length) return; state.step[s.id] = j; renderWalk(s, p); };
  p.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => go(+b.dataset.step)));
  p.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(i + +b.dataset.go)));
  walkKeys = e => {
    if (e.target.closest("input,textarea,[role=tablist]")) return;
    if (e.key === "ArrowRight") go(i+1); else if (e.key === "ArrowLeft") go(i-1);
  };
}
let walkKeys = null;
document.addEventListener("keydown", e => {
  if (walkKeys && document.querySelector(".walk")) walkKeys(e);
});

function route(){
  walkKeys = null;
  const h = location.hash.replace("#","");
  const m = h.match(/^story-(\d)$/);
  if (m) { renderNav(+m[1]); renderStory(+m[1]); window.scrollTo(0,0); }
  else {
    renderNav("home"); renderHome();
    if (h && h !== "home") { const t = document.getElementById(h); if (t) t.scrollIntoView(); }
    else window.scrollTo(0,0);
  }
}
window.addEventListener("hashchange", route);
route();
</script>

</body></html>
