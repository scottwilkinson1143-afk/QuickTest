<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian RM Portal</title>
<meta name="description" content="Prototype relationship manager portal: weekly diary, book coverage and client meeting briefs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell - slim top bar (session status + RM sign-in), view tabs, then a
   12-column grid per view that stacks to one column below 860px. */
:root {
  --bg: #eef2f5;          /* cool page ground with a blue bias */
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --ink: #13212f;         /* navy ink */
  --ink-2: #4a5867;
  --ink-3: #6f7c89;
  --line: #d9e0e7;
  --line-strong: #c3ccd5;
  --accent: #0d6b62;      /* meridian teal: links, selections, primary actions */
  --accent-ink: #ffffff;
  --accent-soft: #dcefec;
  --sel: #0d6b62;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --opportunity: #2a78d6;
  --shadow: 0 1px 2px rgba(19,33,47,.06), 0 4px 16px rgba(19,33,47,.05);
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1318; --surface: #141c23; --surface-2: #1a242d; --ink: #e6ecf1; --ink-2: #aab6c1; --ink-3: #8592a0;
    --line: #26323d; --line-strong: #344250; --accent: #44b5a6; --accent-ink: #06201d; --accent-soft: #15332f; --sel: #44b5a6;
    --series-1: #3987e5; --series-2: #d95926; --opportunity: #3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1318; --surface: #141c23; --surface-2: #1a242d; --ink: #e6ecf1; --ink-2: #aab6c1; --ink-3: #8592a0;
  --line: #26323d; --line-strong: #344250; --accent: #44b5a6; --accent-ink: #06201d; --accent-soft: #15332f; --sel: #44b5a6;
  --series-1: #3987e5; --series-2: #d95926; --opportunity: #3987e5;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-mark { font: 600 17px/1 var(--font-head); letter-spacing: .02em; }
.brand-mark span { color: var(--accent); }
.brand-sub { font-size: 12px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: none; padding: 6px 12px; border-radius: var(--r); cursor: pointer; color: var(--ink-2); font-weight: 500; }
.tab:hover { background: var(--surface-2); }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.session { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.session-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.dot.busy { background: var(--warning); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.rm-select { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.rm-select select { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r); padding: 5px 8px; font-size: 13px; }

main { max-width: 1320px; margin: 0 auto; padding: 20px 20px 48px; }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; margin-bottom: 16px; }
h1 { font: 600 26px/1.15 var(--font-head); margin: 0; text-wrap: balance; letter-spacing: .005em; }
h2 { font: 600 15px/1.3 var(--font-head); margin: 0; letter-spacing: .02em; }
h3 { font: 600 13px/1.3 var(--font-ui); margin: 0; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; }
.span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }
@media (max-width: 860px) { .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column: span 12; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-body { padding: 12px 16px 16px; }
.panel-body.flush { padding: 0; }

/* stat strip */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 16px; }
.stat { background: var(--surface); box-shadow: inset -1px -1px 0 var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat-value { font: 500 24px/1.1 var(--font-num); font-variant-numeric: tabular-nums; }
.stat-label { font-size: 12px; color: var(--ink-2); }
.stat-note { font-size: 11px; color: var(--ink-3); }
button.stat { border: 0; text-align: left; cursor: pointer; }
button.stat:hover { background: var(--surface-2); }

/* chips, pills, buttons */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px; font-size: 11.5px; line-height: 18px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; background: var(--ink-3); }
.chip.critical i { background: var(--critical); } .chip.serious i { background: var(--serious); }
.chip.warning i { background: var(--warning); } .chip.good i { background: var(--good); }
.chip.opportunity i { background: var(--opportunity); border-radius: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c, var(--ink-3)); flex: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r); padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 3px 9px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.linkish { border: 0; background: none; padding: 0; color: var(--ink); cursor: pointer; font-weight: 600; text-align: left; }
.linkish:hover { color: var(--accent); text-decoration: underline; }

/* diary */
.day { border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; }
.day-head { display: flex; justify-content: space-between; padding: 10px 16px 6px; font-size: 12px; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; font-weight: 500; }
.day-head.today { color: var(--accent); }
.mtg { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 14px; padding: 10px 16px; border-top: 1px dashed var(--line); align-items: start; }
.mtg:hover { background: var(--surface-2); }
.mtg-time { font: 500 13px/1.3 var(--font-num); }
.mtg-time span { display: block; font: 400 11px var(--font-ui); color: var(--ink-3); }
.mtg-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.mtg-line { font-size: 12.5px; color: var(--ink-2); }
.type-tag { font-size: 11px; font-weight: 500; letter-spacing: .02em; color: var(--ink-2); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
@media (max-width: 560px) { .mtg { grid-template-columns: 52px minmax(0, 1fr); } .mtg > .btn { grid-column: 2; justify-self: start; } }

/* attention list */
.att { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.att:first-child { border-top: 0; }
.att-meta { font-size: 12px; color: var(--ink-3); }
.score { font: 500 12px var(--font-num); color: var(--ink-2); text-align: right; }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--ink-3); letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
th button { border: 0; background: none; padding: 0; color: inherit; font: inherit; cursor: pointer; letter-spacing: inherit; }
th button:hover { color: var(--accent); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td { background: var(--surface-2); }
.book-scroll { max-height: 640px; overflow: auto; }

/* selections bar (mirrors Qlik's current selections) */
.selbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; min-height: 44px; }
.selbar .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.sel { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 4px; padding: 2px 4px 2px 8px; font-size: 12px; }
.sel b { font-weight: 600; }
.sel button { border: 0; background: none; cursor: pointer; padding: 0 4px; color: var(--ink-2); font-size: 14px; line-height: 1; }
.filters { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-bottom: 12px; align-items: flex-end; }
.filter-group { display: flex; flex-direction: column; gap: 5px; }
.toggle { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 4px; padding: 3px 9px; font-size: 12px; cursor: pointer; }
.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.toggle .n { font-family: var(--font-num); color: var(--ink-3); margin-left: 4px; font-size: 11px; }
.search { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r); padding: 5px 10px; min-width: 0; width: 220px; max-width: 100%; }

/* coverage bar */
.covbar { display: flex; height: 28px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface); }
.covbar button { border: 0; padding: 0; cursor: pointer; background: var(--c); min-width: 6px; position: relative; }
.covbar button[aria-pressed="false"].dim { opacity: .3; }
.cov-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; }
.cov-legend button { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }

/* brief */
.brief-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 16px; margin-bottom: 16px; }
@media (max-width: 860px) { .brief-head { grid-template-columns: minmax(0, 1fr); } }
.who { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.who-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 13px; }
.next-card { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.next-card.none { border-left: 4px solid var(--critical); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; min-width: 0; }
.tp { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 0 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.tp:first-child { border-top: 0; padding-top: 2px; }
.tp-bar { border-radius: 2px; background: var(--c); }
.tp-title { font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.tp-sev { font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.tp-ev { font-size: 12.5px; color: var(--ink-2); }
.tp-act { font-size: 12.5px; color: var(--ink); margin-top: 2px; }
.tp-act::before { content: "→ "; color: var(--accent); font-weight: 600; }
.delta { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.delta:first-child { border-top: 0; padding-top: 0; }
.delta .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.delta .sub { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); }
.up::before { content: "▲ "; font-size: 9px; } .down::before { content: "▼ "; font-size: 9px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow); }
.util { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.util-track { position: relative; flex: 1; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.util-fill { position: absolute; inset: 0 auto 0 0; background: var(--c, var(--series-1)); border-radius: 0 3px 3px 0; }
.util-tick { position: absolute; top: -1px; bottom: -1px; left: 85%; width: 1px; background: var(--ink-3); }
.timeline-item { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.timeline-item:first-child { border-top: 0; padding-top: 0; }
.timeline-date { font: 12px/1.4 var(--font-num); color: var(--ink-2); }
.timeline-body { min-width: 0; font-size: 13px; }
.timeline-body p { margin: 3px 0 0; color: var(--ink-2); }
.sent { font-size: 11px; color: var(--ink-3); }
.person { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
.person:first-child { border-top: 0; padding-top: 0; }
.person .contact { grid-column: 1 / -1; font: 12px var(--font-num); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 14px; user-select: all; }
.empty { color: var(--ink-3); font-size: 13px; padding: 4px 0; }
.back { margin-bottom: 12px; }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .axis-text { fill: var(--ink-3); font: 11px var(--font-ui); }
.chart .label-text { fill: var(--ink-2); font: 500 11px var(--font-ui); }
.chart .cross { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: var(--shadow); white-space: nowrap; z-index: 5; }
.tooltip .t { color: var(--ink-3); font-size: 11px; }
.tooltip .row { display: flex; align-items: center; gap: 6px; }
.tooltip .sw { width: 10px; height: 2px; border-radius: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }

/* session overlay, toast, about */
.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 82%, transparent); display: grid; place-items: center; z-index: 50; padding: 16px; }
.overlay-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 20px 22px; width: min(420px, 100%); }
.steps { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.steps li { display: flex; gap: 8px; align-items: center; color: var(--ink-3); }
.steps li.done { color: var(--ink); } .steps li.done::before { content: "✓"; color: var(--good); width: 14px; }
.steps li.active { color: var(--ink); } .steps li.active::before { content: "•"; color: var(--warning); width: 14px; }
.steps li:not(.done):not(.active)::before { content: "○"; width: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 6px; font-size: 13px; z-index: 60; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
details.about { margin-top: 24px; }
details.about summary { cursor: pointer; color: var(--ink-2); font-weight: 500; }
details.about pre { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: 11.5px/1.45 var(--font-num); overflow-x: auto; max-height: 360px; }
.about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 10px; }
.foot { margin-top: 28px; font-size: 12px; color: var(--ink-3); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

[hidden] { display: none !important; }
#ov-error { margin-top: 12px; font-size: 13px; color: var(--ink-2); }
#ov-error pre { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 12px var(--font-num); }
.mode-tag { font: 500 11px var(--font-num); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 6px; color: var(--ink-2); }
</style>

</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><div class="brand-mark">Meridian<span>·</span>RM</div><div class="brand-sub">Relationship portal</div></div>
    <nav class="tabs" aria-label="Views">
      <button class="tab" data-nav="week">My week</button>
      <button class="tab" data-nav="book">My book</button>
    </nav>
    <div class="session">
      <div class="session-status" id="session-status"><span class="dot busy"></span><span>Starting session…</span></div>
      <label class="rm-select" for="rm-pick">Signed in as
        <select id="rm-pick" aria-label="Relationship manager"></select>
      </label>
    </div>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<div id="overlay" class="overlay" hidden><div class="overlay-card"><h2 id="ov-title">Opening your session</h2><ul class="steps" id="ov-steps"></ul><div id="ov-error" hidden></div></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="portal.js"></script>
</body>
</html>
