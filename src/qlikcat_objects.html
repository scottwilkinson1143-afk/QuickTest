<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --grn1:    #1D9E75;
    --grn2:    #97C459;
    --grn3:    #0F6E56;
    --navy:    #1A1A2E;
    --light:   #F0FAF5;
    --mid:     #D1F0E5;
    --white:   #FFFFFF;
    --subtext: #557766;
    --border:  #C5E8D8;
    --shadow:  0 2px 12px rgba(15,110,86,0.10);
    --card-shadow: 0 2px 8px rgba(15,110,86,0.13);
    --gap:     0.75rem;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Arial', sans-serif;
    color: var(--navy);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    /* Background: subtle geometric SVG pattern in brand green tones */
    background-color: #EAF7F1;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(29,158,117,0.08) 0%, transparent 55%),
      radial-gradient(circle at 85% 75%, rgba(15,110,86,0.07) 0%, transparent 55%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg stroke='%231D9E75' stroke-width='0.4' stroke-opacity='0.12'%3E%3Ccircle cx='30' cy='30' r='20'/%3E%3Ccircle cx='30' cy='30' r='12'/%3E%3Ccircle cx='30' cy='30' r='4'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    background-size: auto, auto, 60px 60px;
  }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    background: var(--white);
    border-bottom: 2px solid var(--border);
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    height: 62px;
    box-shadow: var(--shadow);
    flex-shrink: 0;
    z-index: 10;
  }

  .logo-mark { width: 40px; height: 40px; flex-shrink: 0; }
  .logo-text  { display: flex; flex-direction: column; line-height: 1; }
  .logo-wordmark { font-size: 1.5rem; letter-spacing: -0.5px; }
  .logo-wordmark .qlik { font-weight: 300; color: var(--navy); }
  .logo-wordmark .cat  { font-weight: 700; color: var(--navy); }
  .logo-tagline {
    font-size: 0.58rem; letter-spacing: 0.28em;
    color: var(--subtext); margin-top: 2px; text-transform: uppercase;
  }

  /* ── Nav ribbon ─────────────────────────────────────────── */
  nav {
    background: var(--grn3);
    display: flex;
    align-items: stretch;
    height: 46px;
    flex-shrink: 0;
    z-index: 9;
  }

  .nav-btn {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0 1.25rem;
    background: none; border: none;
    border-bottom: 3px solid transparent;
    color: rgba(255,255,255,0.75);
    font-size: 0.84rem; font-family: 'Arial', sans-serif;
    font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
  }
  .nav-btn:hover { color: var(--white); background: rgba(255,255,255,0.08); }
  .nav-btn.active {
    color: var(--white);
    border-bottom-color: var(--grn2);
    background: rgba(255,255,255,0.10);
    font-weight: 700;
  }
  .nav-divider { width: 1px; background: rgba(255,255,255,0.18); margin: 10px 0; }

  /* ── Main body ──────────────────────────────────────────── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: var(--gap);
    gap: var(--gap);
    min-height: 0;
  }

  /* ── KPI row — 20% of body height ──────────────────────── */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--gap);
    flex: 0 0 20%;
    min-height: 0;
  }

  /* ── Chart row — remaining 80% ──────────────────────────── */
  .chart-row {
    display: flex;
    gap: var(--gap);
    flex: 1;
    min-height: 0;
  }

  /* Large pane ~60% */
  .pane-main {
    flex: 6;
    min-width: 0;
  }

  /* Side stack ~30% */
  .pane-side {
    flex: 3;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    min-width: 0;
  }

  .pane-side-top,
  .pane-side-bottom {
    flex: 1;
    min-height: 0;
  }

  /* ── Object card ─────────────────────────────────────────── */
  .obj-card {
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(4px);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100%;
  }

  .obj-card-header {
    background: rgba(240,250,245,0.95);
    border-bottom: 1px solid var(--border);
    padding: 0.38rem 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-shrink: 0;
  }
  .obj-card-header .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--grn1);
    flex-shrink: 0;
  }
  .obj-card-header .obj-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--subtext);
    flex: 1;
  }
  .obj-card-header .obj-id {
    font-size: 0.62rem;
    color: #aac4b8;
    font-family: monospace;
    letter-spacing: 0.02em;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .obj-body {
    flex: 1;
    min-height: 0;
    position: relative;
  }

  /* qlik-embed fills card body */
  qlik-embed {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Loading spinner */
  .obj-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    color: var(--subtext);
    font-size: 0.78rem;
    background: rgba(240,250,245,0.6);
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--mid);
    border-top-color: var(--grn1);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Footer ─────────────────────────────────────────────── */
  footer {
    background: var(--grn3);
    color: rgba(255,255,255,0.5);
    font-size: 0.7rem; letter-spacing: 0.08em;
    text-align: center; padding: 0.45rem;
    flex-shrink: 0;
  }
  footer b { color: var(--grn2); }
</style>
</head>

<script>
  document.addEventListener('DOMContentLoaded', function() {

    // ── Build nav ──────────────────────────────────────────
    const nav = document.getElementById('nav');
    MENU.forEach((item, i) => {
      if (i > 0) {
        const d = document.createElement('div');
        d.className = 'nav-divider';
        nav.appendChild(d);
      }
      const iconHtml = document.getElementById(item.iconId).innerHTML;
      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.id        = 'nav-' + item.key;
      btn.innerHTML = iconHtml + '<span>' + item.label + '</span>';
      btn.onclick   = function() { loadView(item.key); };
      nav.appendChild(btn);
    });

    // ── Object slot definitions ────────────────────────────
    // Each slot: { bodyId, loadId, labelId }
    const SLOTS = [
      { key: 'kpi1',       bodyId: 'body-kpi1',       loadId: 'load-kpi1',       labelId: 'label-kpi1'       },
      { key: 'kpi2',       bodyId: 'body-kpi2',       loadId: 'load-kpi2',       labelId: 'label-kpi2'       },
      { key: 'kpi3',       bodyId: 'body-kpi3',       loadId: 'load-kpi3',       labelId: 'label-kpi3'       },
      { key: 'kpi4',       bodyId: 'body-kpi4',       loadId: 'load-kpi4',       labelId: 'label-kpi4'       },
      { key: 'main',       bodyId: 'body-main',       loadId: 'load-main',       labelId: 'label-main'       },
      { key: 'sideTop',    bodyId: 'body-sideTop',    loadId: 'load-sideTop',    labelId: 'label-sideTop'    },
      { key: 'sideBottom', bodyId: 'body-sideBottom', loadId: 'load-sideBottom', labelId: 'label-sideBottom' },
    ];

    // ── Create one qlik-embed object ───────────────────────
    function makeEmbed(objectId) {
      const el = document.createElement('qlik-embed');
      el.setAttribute('ui',           'classic/chart');
      el.setAttribute('app-id',       APP_ID);
      el.setAttribute('object-id',    objectId);
      el.setAttribute('show-toolbar', 'true');
      return el;
    }

    // ── Load a view — replace all objects ─────────────────
    function loadView(viewKey) {
      const view = VIEWS[viewKey];
      if (!view) return;

      // Nav active state
      MENU.forEach(function(m) {
        document.getElementById('nav-' + m.key)
          .classList.toggle('active', m.key === viewKey);
      });

      // For each slot: remove old embed, show spinner, create new embed
      SLOTS.forEach(function(slot) {
        const body    = document.getElementById(slot.bodyId);
        const loading = document.getElementById(slot.loadId);
        const labelEl = document.getElementById(slot.labelId);
        const objectId = view.objects[slot.key];

        // Remove any existing embed
        const existing = body.querySelector('qlik-embed');
        if (existing) existing.remove();

        // Show object ID in the card header
        if (labelEl) labelEl.textContent = objectId !== 'YOUR_OBJECT_ID' ? objectId : '';

        // Show spinner
        loading.style.display = 'flex';

        // Only render if a real object ID has been set
        if (!objectId || objectId === 'YOUR_OBJECT_ID') {
          loading.innerHTML = '<span style="font-size:0.72rem;color:#aac4b8;letter-spacing:0.04em">Object ID not set</span>';
          return;
        }

        // Create embed
        const embed = makeEmbed(objectId);
        embed.addEventListener('load', function() {
          loading.style.display = 'none';
        });
        body.appendChild(embed);
      });
    }

    // ── Load Executive Dashboard on startup ────────────────
    loadView('executive');

  }); // end DOMContentLoaded
</script>
