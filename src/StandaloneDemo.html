<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standalone Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #009845;
    --green-dark: #00873d;
    --gray: #54565A;
    --deep-blue: #19426C;
    --sky: #10CFC9;
    --ocean: #006580;
    --accent-grey: #A9B3B6;
    --bg: #F4F6F7;
    --card: #FFFFFF;
    --line: #E3E7E9;
    --muted: #7A7D82;
    --radius: 18px;
    --shadow: 0 4px 18px rgba(25, 66, 108, 0.08);
    --gap: clamp(10px, 1.6vh, 18px);
    --pad: clamp(14px, 2vh, 24px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, Segoe UI, sans-serif;
    background: var(--bg);
    color: var(--gray);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    height: 100vh; height: 100dvh;
    display: grid; grid-template-rows: auto 1fr;
    overflow: hidden;
  }

  /* ---------- Floating title bar ---------- */
  .topbar-wrap { padding: var(--gap) var(--gap) 0; }
  .topbar {
    background: var(--card); border-radius: 24px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 16px;
    padding: clamp(8px, 1.2vh, 12px) 22px;
  }
  .logo { height: 32px; display: flex; align-items: center; flex-shrink: 0; }
  .logo img { height: 32px; width: auto; display: block; }
  .logo-placeholder {
    height: 32px; padding: 0 10px; display: none; align-items: center;
    border: 1.5px dashed var(--accent-grey); border-radius: 8px;
    font-size: 10px; color: var(--muted); white-space: nowrap;
  }
  .divider { width: 1px; height: 28px; background: var(--line); flex-shrink: 0; }
  .title-block { flex: 1; min-width: 0; }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--deep-blue); }
  .title-block h1 {
    margin: 1px 0 0; font-size: clamp(14px, 1.4vw, 18px); font-weight: 700; color: var(--deep-blue);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .title-block h1 span { color: var(--green); }
  .top-progress { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .top-progress strong { color: var(--deep-blue); }
  .pill-btn {
    border: 2px solid var(--green); color: var(--green); background: transparent;
    font: inherit; font-weight: 600; font-size: 13px; padding: 6px 16px; border-radius: 999px; cursor: pointer;
  }
  .pill-btn:hover { background: var(--green); color: #fff; }

  /* ---------- Layout ---------- */
  .layout {
    min-height: 0; padding: var(--gap);
    display: grid; grid-template-columns: clamp(230px, 20vw, 290px) 1fr; gap: var(--gap);
  }

  /* ---------- Demo Progress sidebar ---------- */
  .sidebar {
    min-height: 0; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: var(--pad) 14px; display: flex; flex-direction: column;
  }
  .sidebar h2 { margin: 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--deep-blue); }
  .bar { height: 5px; background: var(--line); border-radius: 99px; margin: 10px 6px 12px; overflow: hidden; flex-shrink: 0; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .3s; }
  .chapters { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 2px; }
  .chapters li { flex: 1; display: flex; max-height: 70px; }
  .chapters button {
    width: 100%; text-align: left; font: inherit; cursor: pointer;
    display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center;
    border: 0; background: transparent; border-radius: 12px; padding: 4px 8px; color: var(--gray);
  }
  .chapters button:hover { background: #EEF6F1; }
  .chapters button.active { background: var(--deep-blue); color: #fff; }
  .num {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; border: 2px solid var(--accent-grey); color: var(--gray); background: #fff;
  }
  .chapters button.active .num { border-color: #fff; color: var(--deep-blue); }
  .chapters button.done .num { background: var(--green); border-color: var(--green); color: #fff; }
  .chapters button.done .num::after { content: "✓"; }
  .chapters button.done .num span { display: none; }
  .ch-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
  .ch-label { font-size: 10.5px; font-weight: 500; opacity: .7; margin-top: 1px; }
  .legend { margin: 10px 6px 0; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 5px; flex-shrink: 0; }
  .kbd-hint { margin: 8px 6px 0; font-size: 10.5px; color: var(--muted); flex-shrink: 0; }
  kbd { font-family: inherit; font-size: 9.5px; font-weight: 600; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; }

  /* ---------- Tags ---------- */
  .tag {
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    border: 1.5px solid currentColor; background: #fff;
  }
  .tag.pillar::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .tag.trust { color: var(--green); }
  .tag.freedom { color: var(--ocean); }
  .tag.context { color: var(--deep-blue); }
  .tag.product { color: var(--gray); border-color: var(--line); background: var(--bg); }

  /* ---------- Stage ---------- */
  .stage { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }
  .flow {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 10px 16px; display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; overflow: hidden; flex-shrink: 0;
  }
  .flow .node {
    font-size: clamp(10px, 0.78vw, 11.5px); font-weight: 600; padding: 4px clamp(6px, 0.6vw, 10px); border-radius: 8px; white-space: nowrap;
    background: var(--bg); color: var(--gray); border: 1.5px solid transparent;
  }
  .flow .node.lit { background: var(--green); color: #fff; border-color: var(--green); }
  .flow .node.past { background: #E8F5EE; color: var(--green-dark); }
  .flow .via { margin-left: auto; padding-left: 10px; font-size: 11px; font-weight: 700; color: var(--deep-blue); white-space: nowrap; }
  .flow .via.claude { color: #C15F3C; }
  .flow .arrow { color: var(--accent-grey); font-size: 11px; }
  .flow .flow-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 4px; white-space: nowrap; }

  #chapter { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); }

  .hero {
    flex-shrink: 0; border-radius: var(--radius); padding: clamp(16px, 2.6vh, 30px) clamp(18px, 2.4vw, 34px);
    background: linear-gradient(135deg, var(--deep-blue) 0%, #1d5487 55%, var(--ocean) 100%);
    color: #fff; position: relative; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
  }
  .hero::after {
    content: ""; position: absolute; right: -70px; top: -90px; width: 280px; height: 280px;
    border-radius: 50%; border: 1px dashed rgba(16, 207, 201, .45); pointer-events: none;
  }
  .hero .eyebrow { color: var(--sky); }
  .hero h2 { margin: 4px 0 10px; font-size: clamp(22px, min(3vw, 4.4vh), 40px); line-height: 1.1; font-weight: 800; letter-spacing: -.01em; }
  .hero .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hero .actions { display: flex; flex-direction: column; gap: 8px; align-items: stretch; position: relative; z-index: 1; flex-shrink: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 14px; padding: 10px 18px; border-radius: 999px; border: 2px solid transparent; white-space: nowrap;
  }
  .btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.link { background: var(--green); color: #fff; }
  .btn.link:hover { background: var(--green-dark); }
  .btn.video { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.7); }
  .btn.video:hover { background: #fff; color: var(--deep-blue); }
  .session-note {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: rgba(255,255,255,.95); color: #8A4128; border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 700; white-space: nowrap;
  }

  .grid {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: var(--gap);
  }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--pad) clamp(16px, 1.8vw, 26px); min-height: 0; overflow: auto; }
  .card.wide { grid-column: 1 / -1; }
  .card h3 {
    margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--green);
    display: flex; align-items: center; gap: 8px;
  }
  .card h3 .ico { width: 24px; height: 24px; border-radius: 7px; background: #E8F5EE; display: grid; place-items: center; }
  .card h3 .ico svg { width: 14px; height: 14px; stroke: var(--green); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card p { margin: 0; font-size: clamp(14px, min(1.15vw, 2vh), 16px); }
  .card.outcome { border-left: 5px solid var(--green); }

  .where { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; font-weight: 600; color: var(--deep-blue); flex-wrap: wrap; }
  .where .chip { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--deep-blue); padding: 3px 8px; border-radius: 6px; }
  .where .chip.claude { background: #C15F3C; }
  .where .note { font-weight: 500; color: var(--muted); }

  .prompts { display: flex; flex-direction: column; gap: 8px; }
  .prompt {
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
  }
  .prompt .pn { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ocean); white-space: nowrap; }
  .prompt q { quotes: none; font-size: clamp(14px, min(1.15vw, 2vh), 16px); font-weight: 500; color: var(--deep-blue); }
  .prompt .attach { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--gray); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; }
  .copy { font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--green); color: var(--green); background: #fff; border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
  .copy:hover, .copy.ok { background: var(--green); color: #fff; }

  .nav { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .nav-btn { font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; padding: 9px 22px; border-radius: 999px; border: 2px solid var(--green); background: #fff; color: var(--green); }
  .nav-btn.primary { background: var(--green); color: #fff; }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .done-toggle { font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; background: transparent; border: 0; color: var(--gray); display: inline-flex; align-items: center; gap: 8px; }
  .done-toggle .box { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--accent-grey); display: grid; place-items: center; color: #fff; font-size: 12px; }
  .done-toggle.on .box { background: var(--green); border-color: var(--green); }

  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- Video overlay ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(10, 25, 45, .82); display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  .overlay.open { display: flex; }
  .player { width: min(1100px, 100%); background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .player-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--deep-blue); color: #fff; padding: 10px 16px; font-size: 14px; font-weight: 600; }
  .player-head a { color: var(--sky); font-size: 12px; font-weight: 600; margin-right: 12px; }
  .player-head button { font: inherit; background: transparent; border: 1.5px solid rgba(255,255,255,.6); color: #fff; border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  .player video { display: block; width: 100%; max-height: calc(100dvh - 120px); background: #000; }
  .player .vid-missing { display: none; color: #fff; padding: 40px 24px; text-align: center; font-size: 14px; }

  @media (max-width: 1600px) {
    .flow .arrow { display: none; }
    .flow { gap: 4px; }
    .flow .node.past + .node.past, .flow .node.past + .node.lit { position: relative; }
  }
  @media (max-width: 1400px) { .flow .flow-label { display: none; } }

  /* ---------- Responsive: medium widths (split view) ---------- */
  @media (max-width: 1200px) {
    .flow { display: none; }
    .top-progress { display: none; }
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidebar { padding: 10px 12px; flex-direction: row; align-items: center; gap: 12px; }
    .sidebar h2, .legend, .kbd-hint { display: none; }
    .bar { display: none; }
    .chapters { flex-direction: row; justify-content: space-between; gap: 4px; }
    .chapters li { flex: 1; max-height: none; justify-content: center; }
    .chapters button { grid-template-columns: 28px; justify-content: center; padding: 4px; width: auto; }
    .chapters button.active { background: transparent; }
    .chapters button.active .num { background: var(--deep-blue); border-color: var(--deep-blue); color: #fff; }
    .chapters button.active.done .num { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--deep-blue); background: var(--green); border-color: var(--green); }
    .chapters .ch-text { display: none; }
    .hero { flex-direction: column; align-items: flex-start; }
    .hero .actions { flex-direction: row; flex-wrap: wrap; }
    .grid { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    .card.wide { grid-column: auto; }
    .done-label { display: none; }
  }
  @media (max-width: 560px) {
    .divider, .title-block .eyebrow { display: none; }
    .topbar { padding: 8px 14px; gap: 10px; }
    .prompt { grid-template-columns: 1fr auto; }
    .prompt .pn { grid-column: 1 / -1; }
    .stage { overflow-y: auto; }
    #chapter, .grid { flex: none; }
  }
  /* ---------- Short screens ---------- */
  @media (max-height: 760px) {
    .flow { display: none; }
    .kbd-hint { display: none; }
    .hero .tags .tag { font-size: 11px; padding: 2px 9px; }
  }
</style>
</head>
<body>

<div class="topbar-wrap">
  <header class="topbar">
    <div class="logo">
      <img src="assets/qlik-logo.png" alt="Qlik" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="logo-placeholder">assets/qlik-logo.png</div>
    </div>
    <div class="divider"></div>
    <div class="title-block">
      <div class="eyebrow">Standalone Demo · Trading Data</div>
      <h1>From Pipeline to Insight with <span>Trust, Freedom &amp; Context</span></h1>
    </div>
    <div class="top-progress">Chapter <strong id="topNum">1 / 8</strong></div>
    <button class="pill-btn" id="resetBtn" title="Clear all completed marks">Reset</button>
  </header>
</div>

<div class="layout">
  <aside class="sidebar">
    <h2>Demo Progress</h2>
    <div class="bar"><i id="barFill"></i></div>
    <ul class="chapters" id="chapterList"></ul>
    <div class="legend">
      <span class="tag pillar trust">Trust</span>
      <span class="tag pillar freedom">Freedom</span>
      <span class="tag pillar context">Context</span>
    </div>
    <div class="kbd-hint"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>1</kbd>–<kbd>8</kbd> jump · <kbd>D</kbd> done · <kbd>V</kbd> video</div>
  </aside>

  <main class="stage">
    <div class="flow" id="flow"></div>
    <div id="chapter"></div>
    <div class="nav">
      <button class="nav-btn" id="prevBtn">← Previous</button>
      <button class="done-toggle" id="doneBtn"><span class="box">✓</span><span class="done-label">Mark chapter done</span></button>
      <button class="nav-btn primary" id="nextBtn">Next →</button>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="player">
    <div class="player-head">
      <span id="vidTitle">Video</span>
      <span><a id="vidOpen" href="#" target="_blank" rel="noopener">Open in new tab</a><button id="vidClose">Close ✕</button></span>
    </div>
    <video id="vid" controls preload="metadata"></video>
    <div class="vid-missing" id="vidMissing"></div>
  </div>
</div>

<script>
const ICONS = {
  purpose: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
  interaction: '<svg viewBox="0 0 24 24"><path d="M9 11V5a2 2 0 0 1 4 0v6"/><path d="M13 10a2 2 0 0 1 4 0v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-3l-1.5-3a2 2 0 0 1 3.4-2L9 14"/></svg>',
  outcome: '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  link: '<svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>',
  play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg>'
};

const FLOW = ["MySQL", "Qlik Talend Cloud", "Databricks", "Datasets", "Data Product", "Semantic Layer", "Qlik App", "Master Items", "Insights", "Glossary"];

const CHAPTERS = [
  {
    title: "Qlik Talend Cloud Data Pipeline",
    label: "Qlik Talend Cloud",
    tool: "qtc", where: "Qlik Talend Cloud UI",
    purpose: "Show the flow of data and the transformation of data from the transactional system to the Data Lake. Change Data Capture is enabled.",
    interaction: "Show the pipeline in Qlik Talend Cloud.",
    outcome: "Understanding that Qlik Talend Cloud is extracting data and delivering it to Databricks with change data capture active.",
    link: { url: "https://ukdemosaas.eu.qlikcloud.com/data-integration/data-projects/project/6acde490fe38dc65085c39ca/design?nodeId=6acde490fe38dc65085c39ca.pull_data_from_mysql_platform_storage-aeav", text: "Open the pipeline" },
    pillars: ["trust", "freedom"], products: ["Qlik Talend Cloud"], flow: [0, 1, 2]
  },
  {
    title: "Create Datasets",
    label: "Pipeline",
    tool: "qlik", where: "Qlik Cloud Analytics",
    purpose: "Show how easily the output of the pipeline can be used in Qlik, building four datasets ready for the demo.",
    interaction: "Create the datasets needed for the demo in the Qlik UI.",
    outcome: "Four registered datasets are created and made available in Qlik Cloud.",
    link: { url: "https://ukdemosaas.eu.qlikcloud.com/data-integration/catalog/all?space_filter=6ac64c080630039919a2a00f", text: "Open the catalog" },
    pillars: ["trust", "context"], products: ["Qlik Cloud Analytics"], flow: [3]
  },
  {
    title: "Build a Qlik Data Product",
    label: "Claude",
    tool: "claude", where: "Claude Desktop · Qlik MCP",
    purpose: "Create a data product using an agentic workflow and the Qlik MCP capabilities from Claude Desktop.",
    prompts: [
      { text: "using the qlik ukdemosaas server, can you create me a data product from the datasets available in the Demo Day space ?" },
      { text: "can you refresh the data quality, documentation and generate descriptions for all of the fields?" }
    ],
    outcome: "The Qlik Data Product is created, and the data quality scores and descriptions in the Qlik datasets are updated.",
    link: { url: "https://claude.ai/project/01a11667-61bc-7552-b598-57121bc92149", text: "Open the Claude project" },
    pillars: ["context"], products: ["Claude + Qlik MCP"], flow: [4]
  },
  {
    title: "Edit Semantic Layer",
    label: "Qlik Space",
    tool: "qlik", where: "Qlik Cloud Analytics",
    purpose: "Introduce the value and capability of the semantic layer.",
    interaction: "Show the semantic layer in the Data Product, confirm the relationships between the datasets and activate the data product.",
    outcome: "The Data Product has a defined set of relationships and is activated.",
    link: { url: "https://ukdemosaas.eu.qlikcloud.com/data-integration/catalog/all?space_filter=6ac64c080630039919a2a00f", text: "Open the Qlik space" },
    pillars: ["context"], products: ["Qlik Cloud Analytics"], flow: [5]
  },
  {
    title: "Create a Qlik Application",
    label: "Claude",
    tool: "claude", where: "Claude Desktop · Qlik MCP",
    purpose: "Build a Qlik application based on the Qlik Data Product.",
    prompts: [ { text: "Can you create me an app from the recently activated data product?" } ],
    outcome: "A Qlik application is created from the Trades Data Product.",
    session: true,
    pillars: ["trust", "freedom", "context"], products: [], flow: [6]
  },
  {
    title: "Ensure Governance with Master Items",
    label: "Claude",
    tool: "claude", where: "Claude Desktop · Qlik MCP",
    purpose: "Show that predefined business term definitions can be applied to the application build.",
    prompts: [ { text: "Can you create the master items from the attached document?", attach: "Trades Master Items – Business Definitions.md" } ],
    outcome: "The application has master items and content in line with the corporate governed metrics, not freestyled by AI.",
    session: true,
    pillars: ["trust", "context"], products: ["Claude + Qlik MCP"], flow: [7]
  },
  {
    title: "Utilise the Content",
    label: "Claude",
    tool: "claude", where: "Claude Desktop · Qlik MCP",
    purpose: "Show that the application content can be exploited by agentic platforms.",
    prompts: [
      { text: "Which traders have the highest average off-market spread?" },
      { text: "What's the pay-fixed share of notional by dealer?" },
      { text: "Show me total notional by currency and tenor bucket." }
    ],
    promptNote: "Ask three or more questions.",
    outcome: "Claude provides a complete and trusted series of answers.",
    session: true,
    pillars: ["trust", "freedom"], products: ["Claude + Qlik MCP"], flow: [8]
  },
  {
    title: "Create a Glossary",
    label: "Claude",
    tool: "claude", where: "Claude Desktop · Qlik MCP",
    purpose: "Show that a user glossary can be created from the application content to enhance user engagement.",
    prompts: [ { text: "Can you create a glossary from this app and the master items and then link it to the data product" } ],
    outcome: "A glossary is created, referenced in the application and connected to the Data Product.",
    session: true,
    pillars: ["context"], products: ["Claude + Qlik MCP"], flow: [9]
  }
];
// Video for chapter n lives at assets/videosection{n}.mp4
CHAPTERS.forEach((ch, i) => ch.video = `assets/videosection${i + 1}.mp4`);

const PILLAR_NAMES = { trust: "Trust", freedom: "Freedom", context: "Context" };
const STORE_KEY = "standaloneDemo.v2";
let state = { current: 0, done: [] };
try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && Array.isArray(s.done)) state = s; } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");

function renderSidebar() {
  const list = document.getElementById("chapterList");
  list.innerHTML = CHAPTERS.map((ch, i) => `
    <li><button data-i="${i}" title="${i + 1}. ${esc(ch.title)}" class="${i === state.current ? "active" : ""} ${state.done.includes(i) ? "done" : ""}">
      <span class="num"><span>${i + 1}</span></span>
      <span class="ch-text"><div class="ch-name">${esc(ch.title)}</div><div class="ch-label">${esc(ch.label)}</div></span>
    </button></li>`).join("");
  list.querySelectorAll("button").forEach(b => b.onclick = () => go(+b.dataset.i));
  document.getElementById("barFill").style.width = (state.done.length / CHAPTERS.length * 100) + "%";
  document.getElementById("topNum").textContent = `${state.current + 1} / ${CHAPTERS.length}`;
}

function renderFlow(ch) {
  const first = Math.min(...ch.flow);
  const via = ch.tool === "claude" ? `<span class="via claude">via Claude + Qlik MCP</span>`
            : ch.tool === "qtc" ? `<span class="via">via Qlik Talend Cloud UI</span>`
            : `<span class="via">via Qlik Cloud UI</span>`;
  document.getElementById("flow").innerHTML = `<span class="flow-label">Data journey</span>` +
    FLOW.map((n, i) => {
      const cls = ch.flow.includes(i) ? "lit" : i < first ? "past" : "";
      return `<span class="node ${cls}">${esc(n)}</span>` + (i < FLOW.length - 1 ? `<span class="arrow">→</span>` : "");
    }).join("") + via;
}

function renderChapter() {
  const i = state.current, ch = CHAPTERS[i];
  const chip = ch.tool === "claude" ? `<span class="chip claude">Claude</span>` : `<span class="chip">Qlik</span>`;
  const tags = ch.pillars.map(p => `<span class="tag pillar ${p}">${PILLAR_NAMES[p]}</span>`).join("") +
               ch.products.map(p => `<span class="tag product">${esc(p)}</span>`).join("");

  const interaction = ch.prompts
    ? `<div class="where">${chip} ${esc(ch.where)}${ch.promptNote ? ` <span class="note">· ${esc(ch.promptNote)}</span>` : ""}</div>
       <div class="prompts">${ch.prompts.map((p, k) => `
         <div class="prompt">
           <span class="pn">Prompt ${k + 1}</span>
           <div><q>${esc(p.text)}</q>${p.attach ? `<div><span class="attach">📎 ${esc(p.attach)}</span></div>` : ""}</div>
           <button class="copy" data-text="${esc(p.text)}">Copy</button>
         </div>`).join("")}</div>`
    : `<div class="where">${chip} ${esc(ch.where)}</div><p>${esc(ch.interaction)}</p>`;

  const primary = ch.session
    ? `<span class="session-note">Continue in the existing Claude session</span>`
    : `<a class="btn link" href="${esc(ch.link.url)}" target="_blank" rel="noopener">${esc(ch.link.text)} ${ICONS.link}</a>`;

  const el = document.getElementById("chapter");
  el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade");
  el.innerHTML = `
    <section class="hero">
      <div>
        <div class="eyebrow">Chapter ${pad(i + 1)} · ${esc(ch.label)}</div>
        <h2>${esc(ch.title)}</h2>
        <div class="tags">${tags}</div>
      </div>
      <div class="actions">
        ${primary}
        <button class="btn video" id="videoBtn">${ICONS.play} Watch video</button>
      </div>
    </section>
    <div class="grid">
      <div class="card"><h3><span class="ico">${ICONS.purpose}</span>Purpose</h3><p>${esc(ch.purpose)}</p></div>
      <div class="card outcome"><h3><span class="ico">${ICONS.outcome}</span>Expected outcome</h3><p>${esc(ch.outcome)}</p></div>
      <div class="card wide"><h3><span class="ico">${ICONS.interaction}</span>Interaction</h3>${interaction}</div>
    </div>`;

  el.querySelectorAll(".copy").forEach(b => b.onclick = () => copyText(b));
  document.getElementById("videoBtn").onclick = openVideo;
  renderFlow(ch);

  document.getElementById("prevBtn").disabled = i === 0;
  document.getElementById("nextBtn").textContent = i === CHAPTERS.length - 1 ? "Finish ✓" : "Next →";
  const dt = document.getElementById("doneBtn");
  dt.classList.toggle("on", state.done.includes(i));
  dt.querySelector(".done-label").textContent = state.done.includes(i) ? "Chapter done" : "Mark chapter done";
}

/* ---------- Video ---------- */
const overlay = document.getElementById("overlay"), vid = document.getElementById("vid"), vidMissing = document.getElementById("vidMissing");
function openVideo() {
  const i = state.current, ch = CHAPTERS[i];
  document.getElementById("vidTitle").textContent = `Chapter ${i + 1} · ${ch.title}`;
  document.getElementById("vidOpen").href = ch.video;
  vid.style.display = "block"; vidMissing.style.display = "none";
  vid.src = ch.video;
  overlay.classList.add("open");
  vid.play().catch(() => {});
}
vid.addEventListener("error", () => {
  vid.style.display = "none"; vidMissing.style.display = "block";
  vidMissing.textContent = `Video not found: ${CHAPTERS[state.current].video}`;
});
function closeVideo() { vid.pause(); vid.removeAttribute("src"); vid.load(); overlay.classList.remove("open"); }
document.getElementById("vidClose").onclick = closeVideo;
overlay.addEventListener("click", e => { if (e.target === overlay) closeVideo(); });

/* ---------- Copy ---------- */
function copyText(btn) {
  const t = btn.dataset.text;
  const ok = () => { btn.textContent = "Copied"; btn.classList.add("ok"); setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("ok"); }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, () => fallbackCopy(t, ok));
  else fallbackCopy(t, ok);
}
function fallbackCopy(t, ok) {
  const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); ok(); } catch (e) {} ta.remove();
}

/* ---------- State ---------- */
function toggleDone(i, force) {
  const has = state.done.includes(i);
  const want = force === undefined ? !has : force;
  if (want && !has) state.done.push(i);
  if (!want && has) state.done = state.done.filter(x => x !== i);
  save(); render();
}
function go(i) { if (i < 0 || i >= CHAPTERS.length) return; state.current = i; save(); render(); }
function render() { renderSidebar(); renderChapter(); }

document.getElementById("prevBtn").onclick = () => go(state.current - 1);
document.getElementById("nextBtn").onclick = () => { toggleDone(state.current, true); if (state.current < CHAPTERS.length - 1) go(state.current + 1); };
document.getElementById("doneBtn").onclick = () => toggleDone(state.current);
document.getElementById("resetBtn").onclick = () => { state = { current: 0, done: [] }; save(); render(); };

document.addEventListener("keydown", e => {
  if (overlay.classList.contains("open")) { if (e.key === "Escape") closeVideo(); return; }
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") go(state.current + 1);
  else if (e.key === "ArrowLeft") go(state.current - 1);
  else if (/^[1-8]$/.test(e.key)) go(+e.key - 1);
  else if (e.key.toLowerCase() === "d") toggleDone(state.current);
  else if (e.key.toLowerCase() === "v") openVideo();
});

render();
</script>
</body>
</html>
