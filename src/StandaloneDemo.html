<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standalone Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #009845;
    --green-dark: #00873d;
    --gray: #54565A;
    --deep-blue: #19426C;
    --sky: #10CFC9;
    --ocean: #006580;
    --accent-grey: #A9B3B6;
    --mint: #4DB494;
    --bg: #F4F6F7;
    --card: #FFFFFF;
    --line: #E3E7E9;
    --muted: #7A7D82;
    --radius: 20px;
    --shadow: 0 6px 24px rgba(25, 66, 108, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Inter", system-ui, -apple-system, Segoe UI, sans-serif;
    background: var(--bg);
    color: var(--gray);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Floating title bar ---------- */
  .topbar-wrap { position: sticky; top: 0; z-index: 20; padding: 16px 24px 0; }
  .topbar {
    max-width: 1360px; margin: 0 auto;
    background: var(--card);
    border-radius: 28px;
    box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 20px;
    padding: 14px 28px;
  }
  .logo { height: 36px; display: flex; align-items: center; }
  .logo img { height: 36px; width: auto; display: block; }
  .logo-placeholder {
    height: 36px; padding: 0 12px;
    display: none; align-items: center;
    border: 1.5px dashed var(--accent-grey); border-radius: 8px;
    font-size: 11px; color: var(--muted); white-space: nowrap;
  }
  .divider { width: 1px; height: 32px; background: var(--line); }
  .title-block { flex: 1; min-width: 0; }
  .eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; color: var(--deep-blue);
  }
  .title-block h1 {
    margin: 2px 0 0; font-size: 20px; font-weight: 700; color: var(--deep-blue);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .title-block h1 span { color: var(--green); }
  .top-progress { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  .top-progress strong { color: var(--deep-blue); font-weight: 700; }
  .pill-btn {
    border: 2px solid var(--green); color: var(--green); background: transparent;
    font: inherit; font-weight: 600; font-size: 14px;
    padding: 8px 18px; border-radius: 999px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .pill-btn:hover { background: var(--green); color: #fff; }

  /* ---------- Layout ---------- */
  .layout {
    max-width: 1360px; margin: 24px auto 48px; padding: 0 24px;
    display: grid; grid-template-columns: 300px 1fr; gap: 28px; align-items: start;
  }

  /* ---------- Demo Progress sidebar ---------- */
  .sidebar {
    position: sticky; top: 108px;
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 22px 18px;
  }
  .sidebar h2 {
    margin: 0 6px 4px; font-size: 12px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--deep-blue);
  }
  .bar { height: 6px; background: var(--line); border-radius: 99px; margin: 10px 6px 18px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .3s; }
  .chapters { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .chapters button {
    width: 100%; text-align: left; font: inherit; cursor: pointer;
    display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center;
    border: 0; background: transparent; border-radius: 14px; padding: 10px;
    color: var(--gray);
  }
  .chapters button:hover { background: #EEF6F1; }
  .chapters button.active { background: var(--deep-blue); color: #fff; }
  .num {
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700;
    border: 2px solid var(--accent-grey); color: var(--gray); background: #fff;
  }
  .chapters button.active .num { border-color: #fff; color: var(--deep-blue); }
  .chapters button.done .num { background: var(--green); border-color: var(--green); color: #fff; }
  .chapters button.done .num::after { content: "✓"; }
  .chapters button.done .num span { display: none; }
  .ch-name { font-size: 14px; font-weight: 600; line-height: 1.25; }
  .ch-label { font-size: 11px; font-weight: 500; opacity: .7; margin-top: 2px; }
  .legend { margin: 18px 6px 0; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; }
  .kbd-hint { margin: 12px 6px 0; font-size: 11px; color: var(--muted); }
  kbd {
    font-family: inherit; font-size: 10px; font-weight: 600;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; background: #fff;
  }

  /* ---------- Tags ---------- */
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
    border: 1.5px solid currentColor; background: #fff;
  }
  .tag.pillar::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .tag.trust { color: var(--green); }
  .tag.freedom { color: var(--ocean); }
  .tag.context { color: var(--deep-blue); }
  .tag.product { color: var(--gray); border-color: var(--line); background: var(--bg); }

  /* ---------- Main chapter ---------- */
  .stage { min-width: 0; }
  .flow {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px 20px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .flow .node {
    font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 10px;
    background: var(--bg); color: var(--gray); border: 1.5px solid transparent;
    transition: all .2s;
  }
  .flow .node.lit { background: #E8F5EE; color: var(--green-dark); border-color: var(--green); }
  .flow .arrow { color: var(--accent-grey); font-size: 14px; }
  .flow .flow-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }

  .hero {
    border-radius: var(--radius); padding: 36px 40px;
    background: linear-gradient(135deg, var(--deep-blue) 0%, #1d5487 55%, var(--ocean) 100%);
    color: #fff; position: relative; overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; right: -80px; top: -80px; width: 320px; height: 320px;
    border-radius: 50%; border: 1px dashed rgba(16, 207, 201, .45);
  }
  .hero::before {
    content: ""; position: absolute; right: 40px; bottom: -120px; width: 260px; height: 260px;
    border-radius: 50%; border: 1px solid rgba(255, 255, 255, .12);
  }
  .hero .eyebrow { color: var(--sky); }
  .hero h2 { margin: 8px 0 14px; font-size: 40px; line-height: 1.1; font-weight: 800; letter-spacing: -.01em; max-width: 760px; }
  .hero .tags { display: flex; flex-wrap: wrap; gap: 8px; position: relative; z-index: 1; }
  .hero .tag { background: rgba(255,255,255,.95); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  .card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 26px 28px;
  }
  .card.wide { grid-column: 1 / -1; }
  .card h3 {
    margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--green);
    display: flex; align-items: center; gap: 10px;
  }
  .card h3 .ico {
    width: 28px; height: 28px; border-radius: 8px; background: #E8F5EE;
    display: grid; place-items: center;
  }
  .card h3 .ico svg { width: 16px; height: 16px; stroke: var(--green); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card p { margin: 0; font-size: 16px; }
  .card.outcome { border-left: 5px solid var(--green); }

  .where { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 14px; font-weight: 600; color: var(--deep-blue); }
  .where .chip { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--deep-blue); padding: 3px 9px; border-radius: 6px; }
  .where .chip.claude { background: #C15F3C; }

  .prompts { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .prompt {
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start;
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
  }
  .prompt .pn {
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ocean); padding-top: 3px; white-space: nowrap;
  }
  .prompt q { quotes: none; font-size: 16px; font-weight: 500; color: var(--deep-blue); }
  .prompt .attach {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
    font-size: 12px; font-weight: 600; color: var(--gray);
    background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px;
  }
  .copy {
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    border: 1.5px solid var(--green); color: var(--green); background: #fff;
    border-radius: 999px; padding: 5px 12px; white-space: nowrap;
  }
  .copy:hover { background: var(--green); color: #fff; }
  .copy.ok { background: var(--green); color: #fff; }

  .link-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .go {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    background: var(--green); color: #fff; font-weight: 700; font-size: 15px;
    padding: 12px 22px; border-radius: 999px; transition: background .15s;
  }
  .go:hover { background: var(--green-dark); }
  .go svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2.2; }
  .link-note { font-size: 14px; color: var(--muted); }
  .session-note {
    display: inline-flex; align-items: center; gap: 10px;
    background: #FBF3EF; color: #8A4128; border-radius: 12px; padding: 10px 16px; font-size: 14px; font-weight: 600;
  }

  .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
  .nav-btn {
    font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
    padding: 12px 24px; border-radius: 999px;
    border: 2px solid var(--green); background: #fff; color: var(--green);
  }
  .nav-btn.primary { background: var(--green); color: #fff; }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .done-toggle {
    font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
    background: transparent; border: 0; color: var(--gray);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .done-toggle .box {
    width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--accent-grey);
    display: grid; place-items: center; color: #fff; font-size: 13px;
  }
  .done-toggle.on .box { background: var(--green); border-color: var(--green); }

  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .chapters { flex-direction: row; overflow-x: auto; }
    .chapters button { min-width: 200px; }
    .grid { grid-template-columns: 1fr; }
    .hero h2 { font-size: 30px; }
    .top-progress span.lbl { display: none; }
  }
  @media (max-width: 600px) {
    .topbar-wrap { padding: 10px 12px 0; }
    .topbar { padding: 12px 16px; gap: 12px; }
    .divider, .top-progress { display: none; }
    .layout { padding: 0 16px; }
    .hero { padding: 26px 22px; }
    .card { padding: 22px 20px; }
    .prompt { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="topbar-wrap">
  <header class="topbar">
    <div class="logo">
      <img src="assets/qlik-logo.png" alt="Qlik" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="logo-placeholder">assets/qlik-logo.png</div>
    </div>
    <div class="divider"></div>
    <div class="title-block">
      <div class="eyebrow">Standalone Demo · Trading Data</div>
      <h1>From Pipeline to Insight with <span>Trust, Freedom &amp; Context</span></h1>
    </div>
    <div class="top-progress">
      <span class="lbl">Chapter</span> <strong id="topNum">1 / 8</strong>
    </div>
    <button class="pill-btn" id="resetBtn" title="Clear all completed marks">Reset</button>
  </header>
</div>

<div class="layout">
  <aside class="sidebar">
    <h2>Demo Progress</h2>
    <div class="bar"><i id="barFill"></i></div>
    <ul class="chapters" id="chapterList"></ul>
    <div class="legend">
      <span class="tag pillar trust">Trust</span>
      <span class="tag pillar freedom">Freedom</span>
      <span class="tag pillar context">Context</span>
    </div>
    <div class="kbd-hint"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>1</kbd>–<kbd>8</kbd> jump · <kbd>D</kbd> mark done</div>
  </aside>

  <main class="stage">
    <div class="flow" id="flow"></div>
    <div id="chapter"></div>
    <div class="nav">
      <button class="nav-btn" id="prevBtn">← Previous</button>
      <button class="done-toggle" id="doneBtn"><span class="box">✓</span> Mark chapter done</button>
      <button class="nav-btn primary" id="nextBtn">Next →</button>
    </div>
  </main>
</div>

<script>
const ICONS = {
  purpose: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
  interaction: '<svg viewBox="0 0 24 24"><path d="M9 11V5a2 2 0 0 1 4 0v6"/><path d="M13 10a2 2 0 0 1 4 0v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-3l-1.5-3a2 2 0 0 1 3.4-2L9 14"/></svg>',
  outcome: '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  link: '<svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>'
};

// Flow nodes lit per chapter
const FLOW = ["MySQL", "Qlik Talend Cloud", "Databricks", "Qlik Datasets", "Data Product", "Qlik App", "Glossary", "Claude + Qlik MCP"];

const CHAPTERS = [
  {
    title: "Qlik Talend Cloud Data Pipeline",
    label: "Qlik Talend Cloud",
    tool: "qtc",
    where: "Qlik Talend Cloud UI",
    purpose: "Show the flow of data and the transformation of data from the transactional system to the Data Lake. Change Data Capture is enabled.",
    interaction: "Show the pipeline in Qlik Talend Cloud.",
    outcome: "Understanding that Qlik Talend Cloud is extracting data and delivering it to Databricks.",
    link: { url: "https://ukdemosaas.eu.qlikcloud.com/data-integration/data-projects/project/6acde490fe38dc65085c39ca/design?nodeId=6acde490fe38dc65085c39ca.pull_data_from_mysql_platform_storage-aeav", text: "Open the pipeline" },
    pillars: ["trust", "freedom"],
    products: ["Qlik Talend Cloud"],
    flow: [0, 1, 2]
  },
  {
    title: "Create Datasets",
    label: "Pipeline",
    tool: "qlik",
    where: "Qlik Cloud Analytics",
    purpose: "Show how easily the output of the pipeline can be used in Qlik, building four datasets ready for the demo.",
    interaction: "Create the datasets needed for the demo in the Qlik UI.",
    outcome: "Four registered datasets are created and made available in Qlik Cloud.",
    link: { url: "https://ukdemosaas.eu.qlikcloud.com/data-integration/catalog/all?space_filter=6ac64c080630039919a2a00f", text: "Open the catalog" },
    pillars: ["trust", "context"],
    products: ["Qlik Cloud Analytics"],
    flow: [2, 3]
  },
  {
    title: "Build a Qlik Data Product",
    label: "Claude",
    tool: "claude",
    where: "Claude Desktop · Qlik MCP",
    purpose: "Create a data product using an agentic workflow and the Qlik MCP capabilities from Claude Desktop.",
    prompts: [
      { text: "using the qlik ukdemosaas server, can you create me a data product from the datasets available in the Demo Day space ?" },
      { text: "can you refresh the data quality, documentation and generate descriptions for all of the fields?" }
    ],
    outcome: "The Qlik Data Product is created, and the data quality scores and descriptions in the Qlik datasets are updated.",
    link: { url: "https://claude.ai/project/01a12147-3dc6-70e0-9444-d1116bb27380", text: "Open the Claude project" },
    pillars: ["context"],
    products: ["Claude + Qlik MCP"],
    flow: [3, 4, 7]
  },
  {
    title: "Edit Semantic Layer",
    label: "Qlik Space",
    tool: "qlik",
    where: "Qlik Cloud Analytics",
    purpose: "Introduce the value and capability of the semantic layer.",
    interaction: "Show the semantic layer in the Data Product, confirm the relationships between the datasets and activate the data product.",
    outcome: "The Data Product has a defined set of relationships and is activated.",
    link: { url: "https://ukdemosaas.eu.qlikcloud.com/data-integration/catalog/all?space_filter=6ac64c080630039919a2a00f", text: "Open the Qlik space" },
    pillars: ["context"],
    products: ["Qlik Cloud Analytics"],
    flow: [4]
  },
  {
    title: "Create a Qlik Application",
    label: "Claude",
    tool: "claude",
    where: "Claude Desktop · Qlik MCP",
    purpose: "Build a Qlik application based on the Qlik Data Product.",
    prompts: [
      { text: "Can you create me an app from the recently activated data product?" }
    ],
    outcome: "A Qlik application is created from the Trades Data Product.",
    session: true,
    pillars: ["trust", "freedom", "context"],
    products: [],
    flow: [4, 5, 7]
  },
  {
    title: "Ensure Governance with Master Items",
    label: "Claude",
    tool: "claude",
    where: "Claude Desktop · Qlik MCP",
    purpose: "Show that predefined business term definitions can be applied to the application build.",
    prompts: [
      { text: "Can you create the master items from the attached document?", attach: "Trades Master Items – Business Definitions.md" }
    ],
    outcome: "The application has master items and content in line with the corporate governed metrics, not freestyled by AI.",
    session: true,
    pillars: ["trust", "context"],
    products: ["Claude + Qlik MCP"],
    flow: [5, 7]
  },
  {
    title: "Create a Glossary",
    label: "Claude",
    tool: "claude",
    where: "Claude Desktop · Qlik MCP",
    purpose: "Show that a user glossary can be created from the application content to enhance user engagement.",
    prompts: [
      { text: "Can you create a glossary from this app and the master items and then link it to the data product" }
    ],
    outcome: "A glossary is created, referenced in the application and connected to the Data Product.",
    session: true,
    pillars: ["context"],
    products: ["Claude + Qlik MCP"],
    flow: [4, 5, 6, 7]
  },
  {
    title: "Utilise the Content",
    label: "Claude",
    tool: "claude",
    where: "Claude Desktop · Qlik MCP",
    purpose: "Show that the application content can be exploited by agentic platforms.",
    prompts: [
      { text: "Which traders have the highest average off-market spread?" },
      { text: "What's the pay-fixed share of notional by dealer?" },
      { text: "Show me total notional by currency and tenor bucket." }
    ],
    promptNote: "Ask three or more questions.",
    outcome: "Claude provides a complete and trusted series of answers.",
    session: true,
    pillars: ["trust", "freedom"],
    products: ["Claude + Qlik MCP"],
    flow: [5, 6, 7]
  }
];

const PILLAR_NAMES = { trust: "Trust", freedom: "Freedom", context: "Context" };
const STORE_KEY = "standaloneDemo.v1";
let state = { current: 0, done: [] };
try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && Array.isArray(s.done)) state = s; } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");

function tagsHtml(ch) {
  return ch.pillars.map(p => `<span class="tag pillar ${p}">${PILLAR_NAMES[p]}</span>`).join("") +
         ch.products.map(p => `<span class="tag product">${esc(p)}</span>`).join("");
}

function renderSidebar() {
  const list = document.getElementById("chapterList");
  list.innerHTML = CHAPTERS.map((ch, i) => `
    <li><button data-i="${i}" class="${i === state.current ? "active" : ""} ${state.done.includes(i) ? "done" : ""}">
      <span class="num"><span>${i + 1}</span></span>
      <span><div class="ch-name">${esc(ch.title)}</div><div class="ch-label">${esc(ch.label)}</div></span>
    </button></li>`).join("");
  list.querySelectorAll("button").forEach(b => b.onclick = () => go(+b.dataset.i));
  document.getElementById("barFill").style.width = (state.done.length / CHAPTERS.length * 100) + "%";
  document.getElementById("topNum").textContent = `${state.current + 1} / ${CHAPTERS.length}`;
}

function renderFlow(ch) {
  document.getElementById("flow").innerHTML = `<span class="flow-label">Data journey</span>` +
    FLOW.map((n, i) => `<span class="node ${ch.flow.includes(i) ? "lit" : ""}">${esc(n)}</span>` + (i < FLOW.length - 1 ? `<span class="arrow">→</span>` : "")).join("");
}

function renderChapter() {
  const i = state.current, ch = CHAPTERS[i];
  const chip = ch.tool === "claude" ? `<span class="chip claude">Claude</span>` : `<span class="chip">Qlik</span>`;

  let interaction;
  if (ch.prompts) {
    interaction = `
      <div class="where">${chip} ${esc(ch.where)}${ch.promptNote ? ` · <span style="font-weight:500;color:var(--muted)">${esc(ch.promptNote)}</span>` : ""}</div>
      <div class="prompts">
        ${ch.prompts.map((p, k) => `
          <div class="prompt">
            <span class="pn">Prompt ${k + 1}</span>
            <div><q>${esc(p.text)}</q>${p.attach ? `<div><span class="attach">📎 ${esc(p.attach)}</span></div>` : ""}</div>
            <button class="copy" data-text="${esc(p.text)}">Copy</button>
          </div>`).join("")}
      </div>`;
  } else {
    interaction = `<div class="where">${chip} ${esc(ch.where)}</div><p>${esc(ch.interaction)}</p>`;
  }

  const linkHtml = ch.session
    ? `<span class="session-note">Continue in the existing Claude session</span>`
    : `<a class="go" href="${esc(ch.link.url)}" target="_blank" rel="noopener">${esc(ch.link.text)} ${ICONS.link}</a>
       <span class="link-note">Opens in a new tab</span>`;

  const el = document.getElementById("chapter");
  el.className = "fade";
  el.innerHTML = `
    <section class="hero">
      <div class="eyebrow">Chapter ${pad(i + 1)} · ${esc(ch.label)}</div>
      <h2>${esc(ch.title)}</h2>
      <div class="tags">${tagsHtml(ch)}</div>
    </section>
    <div class="grid">
      <div class="card">
        <h3><span class="ico">${ICONS.purpose}</span>Purpose</h3>
        <p>${esc(ch.purpose)}</p>
      </div>
      <div class="card outcome">
        <h3><span class="ico">${ICONS.outcome}</span>Expected outcome</h3>
        <p>${esc(ch.outcome)}</p>
      </div>
      <div class="card wide">
        <h3><span class="ico">${ICONS.interaction}</span>Interaction</h3>
        ${interaction}
      </div>
      <div class="card wide">
        <div class="link-row">${linkHtml}</div>
      </div>
    </div>`;
  void el.offsetWidth; el.classList.add("fade");

  el.querySelectorAll(".copy").forEach(b => b.onclick = () => copyText(b));
  renderFlow(ch);

  document.getElementById("prevBtn").disabled = i === 0;
  const next = document.getElementById("nextBtn");
  next.textContent = i === CHAPTERS.length - 1 ? "Finish ✓" : "Next →";
  const dt = document.getElementById("doneBtn");
  dt.classList.toggle("on", state.done.includes(i));
  dt.lastChild.textContent = state.done.includes(i) ? " Chapter done" : " Mark chapter done";
}

function copyText(btn) {
  const t = btn.dataset.text;
  const ok = () => { btn.textContent = "Copied"; btn.classList.add("ok"); setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("ok"); }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(ok, () => fallbackCopy(t, ok));
  } else fallbackCopy(t, ok);
}
function fallbackCopy(t, ok) {
  const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); ok(); } catch (e) {} ta.remove();
}

function toggleDone(i, force) {
  const has = state.done.includes(i);
  const want = force === undefined ? !has : force;
  if (want && !has) state.done.push(i);
  if (!want && has) state.done = state.done.filter(x => x !== i);
  save(); render();
}

function go(i) {
  if (i < 0 || i >= CHAPTERS.length) return;
  state.current = i; save(); render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render() { renderSidebar(); renderChapter(); }

document.getElementById("prevBtn").onclick = () => go(state.current - 1);
document.getElementById("nextBtn").onclick = () => {
  toggleDone(state.current, true);
  if (state.current < CHAPTERS.length - 1) go(state.current + 1);
};
document.getElementById("doneBtn").onclick = () => toggleDone(state.current);
document.getElementById("resetBtn").onclick = () => { state = { current: 0, done: [] }; save(); render(); };

document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") go(state.current + 1);
  else if (e.key === "ArrowLeft") go(state.current - 1);
  else if (/^[1-8]$/.test(e.key)) go(+e.key - 1);
  else if (e.key.toLowerCase() === "d") toggleDone(state.current);
});

render();
</script>
</body>
</html>
