<!doctype html>
<html>
<head>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        font-size: 14px;
        background-color: #f5f5f5;
        color: #333;
        height: 100%;
        width: 100%;
      }
      .container {
        padding: 8px;
        gap: 8px;
        position: relative;
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        box-sizing: border-box;
      }
      .classic-app {
        height: 100%;
        width: 100%;
        border: 1px solid #bbb;
        flex-grow: 1;
        border-radius: 3px;
        box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.2);
        position: relative;
        box-sizing: border-box;
        overflow: auto;
        position: relative;
      }
      .viz {
        width: 600px;
        height: 600px;
        padding: 16px;
        border: 1px solid #bbb;
        border-radius: 3px;
        box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.2);
        position:relative;
      }
    </style>      
<script
  crossorigin="anonymous"
  type="application/javascript"
  src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components"
  data-host="https://ukdemosaas.eu.qlikcloud.com"
  data-client-id="a6c0a95b5e3ad86f95aa94a9de35c610"
  data-redirect-uri="https://witty-field-0c6615903.3.azurestaticapps.net/oauth-callback.html"
  data-access-token-storage="session"
  data-auth-type="Oauth2"
></script>
</head>
<body>
  <div>
    <select id="sheetdrop" name="SheetList">
    </select>
  </div>
  <div>
      <div id="classic-app" class="container">
        <h2>qlik-embed classic/app embeds the full Qlik Sense client in the page.</h2>
        <div class="classic-app">
          <qlik-embed
            ui="classic/app"
            app-id="abfd1ad9-0ab0-421d-ac4a-d222a27c2e23"
            sheet-id="cnFcL"
          ></qlik-embed>
        </div>
  </div>
</body>
<script type="module">
  const embeddedObject = document.getElementById("appSheets");
  const refApi = await embeddedObject.getRefApi();
  const doc = await refApi.getDoc();
  const appSheetList = await doc.getSheetList();

  //add the sheet references to a dropdown list
  let dd = document.getElementById('sheetdrop');
  dd.length = 0;
  let defaultOption = document.createElement('option');
  defaultOption.text = "Select a sheet to navigate to";
  dd.add(defaultOption);
  dd.selectedIndex=0;

  let option;
  for (let i=0;i<appSheetList.length; i++) {
    option = document.createElement('option');
    option.text = appSheetList[i].qMeta.title;
    option.value = appSheetList[i].qMeta.id;
    dd.add(option);
  }

  //add a listener to change the object-id property in the qlik-embed element
  dd.addEventListener("change", function() {
    if (dd.selectedIndex > 0)
    {
      let selOption = dd.options[dd.selectedIndex];
      console.log(selOption.value);
      embeddedObject.setAttribute('object-id', selOption.value);
    }
  });
</script>
</html>
